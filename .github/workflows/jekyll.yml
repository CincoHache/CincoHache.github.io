# Construye Cinco Hache con Jekyll y lo despliega en GitHub Pages.
# Requisito: en Settings > Pages, Source debe estar en "GitHub Actions".
name: Publicar Cinco Hache

on:
  push:
    branches: ["main"]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No cancela el que esté en marcha.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'     # si el build falla por versión, este es el valor a tocar
          bundler-cache: true

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir el sitio
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3

  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: construir
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
