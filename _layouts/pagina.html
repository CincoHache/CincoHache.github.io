---
layout: default
---
<article class="pagina-simple envoltura">
  <header class="pagina-simple__cabecera">
    <h1 class="pagina-simple__titular titular">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="articulo__entradilla">{{ page.subtitle }}</p>
    {%- endif %}
  </header>

  <div class="prosa prosa--sin-capitular">
    {{ content }}
  </div>
</article>
