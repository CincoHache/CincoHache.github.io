# ─────────────────────────────────────────────────────────────
#  Cinco Hache — configuración global
#  Los cambios aquí NO se recargan en caliente: hay que parar el
#  servidor (Ctrl+C) y volver a arrancarlo.
# ─────────────────────────────────────────────────────────────

# --- Identidad ------------------------------------------------
title: Cinco Hache
description: >-
  Observaciones del mundo moderno. Un ensayo largo al mes,
  opinión entre medias, y el trabajo propio en el archivo.
lang: es
locale: es_ES

# --- Direcciones ----------------------------------------------
# El repositorio se llama CincoHache.github.io, que es un «sitio de
# usuario»: se publica en la raíz del dominio, así que baseurl va vacío.
# GitHub sirve la URL en minúsculas aunque el usuario lleve mayúsculas.
url: "https://cincohache.github.io"
baseurl: ""

# --- Autoría --------------------------------------------------
author:
  name: Jaime Vázquez de Prada Sáez
  email: ""          # si se rellena, aparece en el pie y en «Sobre mí»
  bio: >-
    Escribo sobre aquello que me interese, generalmente relacionado con temas
    de actualidad o con la industria hostelera, de la que soy profesional.
  retrato: ""        # /assets/img/retrato.jpg

# --- Redes ----------------------------------------------------
# El orden es el orden en que salen en el pie.
#
# Mientras un identificador esté vacío, la casilla aparece igual pero no
# es un enlace: se ve que el sitio está ahí y no se manda a nadie a una
# página que no existe. En cuanto lo rellenes, se vuelve enlace sola.
redes:
  - nombre: Instagram
    id: ""
    url: "https://instagram.com/"
  - nombre: X
    id: ""
    url: "https://x.com/"
  - nombre: Substack
    id: ""
    url: "https://substack.com/@"
  - nombre: Bluesky
    id: ""
    url: "https://bsky.app/profile/"

# --- Comentarios ----------------------------------------------
# ─────────────────────────────────────────────────────────────
#  COMENTARIOS Y NEWSLETTER
#
#  Las dos cosas viven en el mismo proyecto de Supabase. Todo lo que hay
#  que hacer para ponerlas en marcha está en _comentarios/LEEME.md.
#
#  La clave de abajo es **pública a propósito**: la ve cualquiera con el
#  botón derecho del ratón, y no pasa nada. Solo sirve para leer
#  comentarios ya publicados. Escribir se escribe por otra puerta, con
#  una llave distinta que nunca sale del servidor.

supabase:
  url: ""          # https://xxxxxxxxxxxx.supabase.co
  clave: ""        # la clave «anon public» del panel

comentarios:
  # En false, el bloque no se pinta y el artículo queda exactamente como
  # está ahora. Nada de lo demás cambia.
  activos: true
  titulo: "Comentarios"
  # Lo que se lee encima del formulario.
  invitacion: >-
    No hace falta registrarse. Pon cómo quieres que te llame y, si te apetece,
    tu Instagram.
  aviso: >-
    Se publica al momento. Si algo no debería estar, se quita.

newsletter:
  activa: true
  titulo: "Newsletter"
  gancho: "Lo que se publique, en tu correo. Nada más."
  # Aparece bajo el formulario. Es una promesa, así que conviene cumplirla.
  letra_pequena: >-
    Un correo por entrada, sin resúmenes ni recordatorios. Te puedes dar de
    baja de un clic desde cualquiera de ellos, y tu dirección no se le da a
    nadie.

# ─────────────────────────────────────────────────────────────
#  SEO
#
#  De esto se ocupa jekyll-seo-tag: título, descripción, canónica,
#  Open Graph, tarjeta de Twitter y JSON-LD de tipo Article. Lee de
#  aquí y del front matter de cada entrada (`title`, `description`,
#  `image`, `date`, `author`).
# ─────────────────────────────────────────────────────────────

# Imagen que se enseña al compartir una página sin imagen propia.
image: /assets/img/marca/5h-logo-1024.png

# Logotipo del sitio para los datos estructurados.
logo: /assets/img/marca/5h-logo-512.png

# Perfiles para el `sameAs` del JSON-LD. Los rellena quien los tenga.
social:
  name: Jaime Vázquez de Prada Sáez
  links:
    - https://github.com/CincoHache

twitter:
  card: summary_large_image

# Códigos de verificación, si algún día se dan de alta las herramientas
# para editores. Vacío no imprime nada.
webmaster_verifications:
  google: ""
  bing: ""

# --- Construcción ---------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true            # los ladillos llevan id: de ahí sale el sumario
  syntax_highlighter: rouge
  smart_quotes: ["apos", "apos", "ldquo", "rdquo"]

sass:
  style: compressed
  sass_dir: _sass

permalink: /:year/:month/:title/
timezone: Europe/Madrid
excerpt_separator: "<!--mas-->"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: /feed.xml

# --- Valores por defecto de las entradas ----------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      categoria: otros
  - scope:
      path: ""
      type: pages
    values:
      layout: pagina

# --- Qué no se publica ----------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LEEME.md
  - vendor
  - .jekyll-cache
  - .sass-cache
  - node_modules
  - "*.docx"
  - "*.pdf"

show_drafts: false
